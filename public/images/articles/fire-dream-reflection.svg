<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620" role="img" aria-labelledby="title desc">
  <title id="title">火事の夢の印象を三つに分けて振り返る図</title>
  <desc id="desc">どこにいたか、何をしたか、どんな気持ちが残ったかを分けて振り返ります。場所や結末で運勢を決める図ではありません。</desc>
  <rect width="720" height="620" rx="24" fill="#fff9f6"/>
  <g font-family="sans-serif" fill="#29252b">
    <text x="48" y="68" font-size="28" font-weight="bold">夢の印象を、三つに分けてみる</text>
    <rect x="40" y="102" width="640" height="128" rx="20" fill="#f5e0e5"/>
    <text x="68" y="150" font-size="25" font-weight="bold">場所</text>
    <text x="68" y="193" font-size="22">自宅・実家・知らない場所…</text>
    <rect x="40" y="250" width="640" height="128" rx="20" fill="#e2ece7"/>
    <text x="68" y="298" font-size="25" font-weight="bold">行動</text>
    <text x="68" y="341" font-size="22">逃げる・消す・助ける・眺める…</text>
    <rect x="40" y="398" width="640" height="128" rx="20" fill="#e9e4f0"/>
    <text x="68" y="446" font-size="25" font-weight="bold">残った気持ち</text>
    <text x="68" y="489" font-size="22">怖さ・安心・驚き・悲しさ…</text>
    <text x="48" y="568" font-size="18" fill="#71686d">思い出せる範囲だけで大丈夫。吉凶を判定する図ではありません。</text>
    <text x="48" y="600" font-size="16" fill="#71686d">YUMEMI 編集部作成</text>
  </g>
</svg>
